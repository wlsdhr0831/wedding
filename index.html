<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding</title>
  <style>
    :root {
      --bg: #fbf7f2;
      --fg: #3a2f2a;
      --muted: #8a7a70;
      --accent: #b76e79;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      padding: 16px;
    }
    main {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .eyebrow {
      letter-spacing: 0.3em;
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    h1 {
      font-weight: 400;
      font-size: 2rem;
      margin: 0 0 12px;
      line-height: 1.3;
    }
    .date {
      color: var(--muted);
      margin: 0 0 40px;
    }
    hr {
      border: 0;
      border-top: 1px solid #e6dcd3;
      width: 60px;
      margin: 0 auto 40px;
    }
    p.msg {
      line-height: 1.9;
      margin: 0;
      color: var(--fg);
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Wedding Invitation</div>
    <h1>신랑 ♥ 신부</h1>
    <p class="date">2026년 00월 00일 토요일 오후 0시<br>장소 미정</p>
    <hr>
    <p class="msg">
      저희 두 사람이 사랑과 믿음으로<br>
      한 가정을 이루게 되었습니다.<br>
      귀한 걸음으로 축복해 주시면<br>
      더없는 기쁨으로 간직하겠습니다.
    </p>
  </main>
</body>
</html>
